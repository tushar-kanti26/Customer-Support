<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResolveX - Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg-shape bg-a"></div>
  <div class="bg-shape bg-b"></div>

  <main class="container">
    <!-- HEADER -->
    <div class="admin-header">
      <div class="company-info">
        <h1 id="companyTitle">Loading...</h1>
        <p id="companyEmail" class="company-email"></p>
      </div>
      <button id="logoutBtn" class="danger">Logout</button>
    </div>

    <!-- DASHBOARD GRID -->
    <div class="dashboard-grid">
      <!-- DOCUMENTS SECTION -->
      <section class="panel dashboard-section">
        <div class="section-header">
          <h2>📄 Policy Documents</h2>
          <span class="doc-count" id="docCount">0</span>
        </div>
        
        <div class="upload-area">
          <label for="fileInput" class="upload-label">
            <input type="file" id="fileInput" accept=".pdf,.txt,.md,.csv,.log" />
            <span>📤 Click to upload document</span>
          </label>
          <p id="uploadStatus" class="status-message"></p>
        </div>

        <div id="documentsList" class="items-list"></div>
      </section>

      <!-- AGENTS SECTION -->
      <section class="panel dashboard-section">
        <div class="section-header">
          <h2>👥 Support Agents</h2>
          <span class="agent-count" id="agentCount">0</span>
        </div>
        
        <p class="section-hint">Agents register themselves via the Support Agent login</p>
        <div id="agentsList" class="items-list"></div>
      </section>

      <!-- SETTINGS SECTION -->
      <section class="panel dashboard-section">
        <div class="section-header">
          <h2>⚙️ Email Settings</h2>
        </div>
        
        <form id="settingsForm">
          <label>Customer Care Email</label>
          <input type="email" id="settingsCareEmail" />
          
          <label>SMTP Host</label>
          <input type="text" id="settingsSmtpHost" />
          
          <label>SMTP Port</label>
          <input type="number" id="settingsSmtpPort" />
          
          <label>IMAP Host</label>
          <input type="text" id="settingsImapHost" />
          
          <label>IMAP Port</label>
          <input type="number" id="settingsImapPort" />
          
          <button type="button" id="updateSettingsBtn">Update Settings</button>
          <p id="settingsStatus" class="status-message"></p>
        </form>
      </section>
    </div>
  </main>

  <script src="/static/admin-dashboard.js"></script>
</body>
</html>
