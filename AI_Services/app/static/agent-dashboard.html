<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResolveX - Agent Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg-shape bg-a"></div>
  <div class="bg-shape bg-b"></div>

  <main class="container">
    <!-- HEADER -->
    <div class="agent-header">
      <div class="agent-info">
        <h1>Support Console</h1>
        <p id="agentName" class="agent-name">Loading...</p>
      </div>
      <div class="header-actions">
        <button id="refreshBtn" class="btn-primary">Refresh Tickets</button>
        <button id="logoutBtn" class="danger">Logout</button>
      </div>
    </div>

    <!-- TICKETS SECTION -->
    <section class="panel tickets-section">
      <div class="tickets-header">
        <h2 id="ticketSectionTitle">Unresolved Tickets</h2>
        <p id="ticketStatus" class="ticket-status-text"></p>
      </div>

      <div class="ticket-filters" id="ticketFilters">
        <button class="ticket-filter-btn active" data-filter="unresolved" type="button">Unresolved</button>
        <button class="ticket-filter-btn" data-filter="replied" type="button">Replied</button>
        <button class="ticket-filter-btn" data-filter="all" type="button">All</button>
      </div>

      <div id="ticketsContainer" class="tickets-container"></div>
    </section>
  </main>

  <script src="/static/agent-dashboard.js"></script>
</body>
</html>
