<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResolveX - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg-shape bg-a"></div>
  <div class="bg-shape bg-b"></div>

  <main class="container">
    <section class="panel login-container">
      <div class="login-header">
        <h1>ResolveX</h1>
        <p>Multi-Tenant Customer Care Platform</p>
      </div>
      
      <div class="role-tabs">
        <button class="tab-btn active" data-tab="company-login">Company Admin</button>
        <button class="tab-btn" data-tab="company-register">Register Company</button>
        <button class="tab-btn" data-tab="agent-login">Support Agent</button>
      </div>

      <!-- COMPANY ADMIN LOGIN -->
      <div class="tab-content active" id="company-login">
        <h2>Company Admin Login</h2>
        <form id="companyLoginForm">
          <label>Email</label>
          <input type="email" id="companyAdminEmail" placeholder="admin@company.com" required />
          <label>Password</label>
          <input type="password" id="companyAdminPassword" placeholder="Enter password" required />
          <button type="submit">Login</button>
        </form>
        <p id="companyLoginError" class="error-msg" style="display:none;"></p>
      </div>

      <!-- COMPANY REGISTRATION -->
      <div class="tab-content" id="company-register">
        <h2>Register Your Company</h2>
        <form id="companyRegisterForm">
          <label>Company Name</label>
          <input type="text" id="companyName" placeholder="Acme Inc." required />
          
          <label>Admin Email</label>
          <input type="email" id="adminEmail" placeholder="admin@company.com" required />
          
          <label>Admin Username</label>
          <input type="text" id="adminUsername" placeholder="admin_user" required />
          
          <label>Password</label>
          <input type="password" id="adminPassword" placeholder="Create password" required />
          
          <hr style="margin: 1rem 0; border: 0; border-top: 1px solid #d7d7d7;" />
          
          <h3 style="margin-top: 1rem; font-size: 1rem;">Email Configuration</h3>
          <p style="font-size: 0.85rem; color: #666;">For reading customer emails and sending replies</p>
          
          <label>Customer Care Email</label>
          <input type="email" id="customerCareEmail" placeholder="support@company.com" required />
          
          <label>Email App Password</label>
          <input type="password" id="emailAppPassword" placeholder="Gmail app-specific password" required />
          <small>For Gmail: Settings > Security > App passwords (requires 2FA)</small>
          
          <label>IMAP Host (optional)</label>
          <input type="text" id="imapHost" placeholder="imap.gmail.com" value="imap.gmail.com" />
          
          <label>IMAP Port (optional)</label>
          <input type="number" id="imapPort" placeholder="993" value="993" />
          
          <label>SMTP Host (optional)</label>
          <input type="text" id="smtpHost" placeholder="smtp.gmail.com" value="smtp.gmail.com" />
          
          <label>SMTP Port (optional)</label>
          <input type="number" id="smtpPort" placeholder="587" value="587" />
          
          <button type="submit">Register Company</button>
        </form>
        <p id="companyRegisterError" class="error-msg" style="display:none;"></p>
      </div>

      <!-- SUPPORT AGENT LOGIN -->
      <div class="tab-content" id="agent-login">
        <h2>Support Agent Login</h2>
        <form id="agentLoginForm">
          <label>Company Email (optional)</label>
          <input type="email" id="agentCompanyEmail" placeholder="support@company.com" />
          <label>Username</label>
          <input type="text" id="agentUsername" placeholder="agent_username" required />
          <label>Password</label>
          <input type="password" id="agentPassword" placeholder="Enter password" required />
          <button type="submit">Login</button>
        </form>
        <p id="agentLoginError" class="error-msg" style="display:none;"></p>

        <hr style="margin: 1rem 0; border: 0; border-top: 1px solid #d7d7d7;" />

        <h2>New Support Agent? Register</h2>
        <form id="agentRegisterForm">
          <label>Company Email</label>
          <input type="email" id="agentRegisterCompanyEmail" placeholder="support@company.com" required />
          <label>Username</label>
          <input type="text" id="agentRegisterUsername" placeholder="agent_username" required />
          <label>Password</label>
          <input type="password" id="agentRegisterPassword" placeholder="Create password" required />
          <button type="submit">Register as Support Agent</button>
        </form>
        <p id="agentRegisterError" class="error-msg" style="display:none;"></p>
      </div>
    </section>
  </main>

  <script src="/static/login.js"></script>
</body>
</html>
